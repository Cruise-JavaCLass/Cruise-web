name: Frontend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node.js 22 / Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run Vitest Suites with Coverage
        run: npm run test:ci
        env:
          CI: true

      - name: Upload Vitest Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./coverage/
          retention-days: 14

      - name: Build Production Bundle (Vite)
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./dist/
          retention-days: 7
